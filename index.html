
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Hindi Translator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: white;
            padding: 28px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #4338ca;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .languages {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        select {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            background: white;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 15px;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.85;
        }

        .swap {
            background: #e0e7ff;
            color: #3730a3;
            font-size: 20px;
        }

        .text-areas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        textarea {
            width: 100%;
            height: 210px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            resize: vertical;
            font-family: inherit;
            font-size: 17px;
            line-height: 1.6;
        }

        textarea:focus, select:focus {
            outline: 2px solid #818cf8;
            border-color: #6366f1;
        }

        #output {
            background: #f8fafc;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .translate {
            flex: 1;
            background: #4f46e5;
            color: white;
            font-weight: bold;
        }

        .secondary {
            background: #e5e7eb;
            color: #222;
        }

        #status {
            min-height: 24px;
            margin-top: 15px;
            text-align: center;
            color: #555;
            overflow-wrap: anywhere;
        }

        .note {
            font-size: 13px;
            color: #777;
            margin-top: 12px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                padding: 18px;
            }

            .text-areas {
                grid-template-columns: 1fr;
            }

            textarea {
                height: 150px;
            }

            .languages {
                gap: 6px;
            }

            select {
                font-size: 14px;
                padding: 10px 5px;
            }

            button {
                padding: 11px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Language Translator</h1>
        <p class="subtitle">Translate between English and Hindi</p>

        <div class="languages">
            <select id="sourceLang" aria-label="Source language">
                <option value="en">English</option>
                <option value="hi">Hindi</option>
            </select>

            <button class="swap" id="swapBtn"
                    type="button" title="Swap languages"
                    aria-label="Swap languages">⇄</button>

            <select id="targetLang" aria-label="Target language">
                <option value="hi">Hindi</option>
                <option value="en">English</option>
            </select>
        </div>

        <div class="text-areas">
            <textarea id="input"
                placeholder="Enter text to translate..."
                aria-label="Text to translate"></textarea>

            <textarea id="output"
                placeholder="Translation will appear here..."
                aria-label="Translated text"
                readonly></textarea>
        </div>

        <div class="actions">
            <button class="translate" id="translateBtn"
                    type="button">Translate</button>

            <button class="secondary" id="copyBtn"
                    type="button">Copy</button>

            <button class="secondary" id="listenBtn"
                    type="button">Listen</button>

            <button class="secondary" id="clearBtn"
                    type="button">Clear</button>
        </div>

        <p id="status" role="status" aria-live="polite"></p>

        <p class="note">
            Translation requires an internet connection.
            Automated translations may not always be exact.
        </p>
    </main>

    <script>
        const sourceLang = document.getElementById("sourceLang");
        const targetLang = document.getElementById("targetLang");
        const input = document.getElementById("input");
        const output = document.getElementById("output");
        const status = document.getElementById("status");
        const translateBtn = document.getElementById("translateBtn");

        async function translateText() {
            const text = input.value.trim();

            if (!text) {
                status.textContent = "Please enter some text first.";
                input.focus();
                return;
            }

            if (sourceLang.value === targetLang.value) {
                status.textContent = "Choose two different languages.";
                return;
            }

            translateBtn.disabled = true;
            translateBtn.textContent = "Translating...";
            status.textContent = "Please wait...";
            output.value = "";

            try {
                const url =
                    "https://translate.googleapis.com/translate_a/single" +
                    "?client=gtx" +
                    "&sl=" + encodeURIComponent(sourceLang.value) +
                    "&tl=" + encodeURIComponent(targetLang.value) +
                    "&dt=t&q=" + encodeURIComponent(text);

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("Translation service unavailable.");
                }

                const data = await response.json();

                if (!Array.isArray(data) || !Array.isArray(data[0])) {
                    throw new Error("Unexpected translation response.");
                }

                const translated = data[0]
                    .filter(part => Array.isArray(part) &&
                                    typeof part[0] === "string")
                    .map(part => part[0])
                    .join("");

                if (!translated.trim()) {
                    throw new Error("No translation was returned.");
                }

                output.value = translated;
                status.textContent = "Translation completed.";

            } catch (error) {
                status.textContent =
                    "Translation failed. Check your internet connection " +
                    "and try again. If it continues, the service may be " +
                    "temporarily unavailable.";

                console.error("Translation error:", error);
            } finally {
                translateBtn.disabled = false;
                translateBtn.textContent = "Translate";
            }
        }

        translateBtn.addEventListener("click", translateText);

        input.addEventListener("keydown", function(event) {
            if (event.ctrlKey && event.key === "Enter") {
                translateText();
            }
        });

        document.getElementById("swapBtn").addEventListener("click", () => {
            const oldSource = sourceLang.value;

            sourceLang.value = targetLang.value;
            targetLang.value = oldSource;

            const oldInput = input.value;
            input.value = output.value;
            output.value = oldInput;

            status.textContent = "Languages swapped.";
        });

        document.getElementById("copyBtn").addEventListener("click",
            async () => {
                if (!output.value) {
                    status.textContent = "Nothing to copy.";
                    return;
                }

                try {
                    await navigator.clipboard.writeText(output.value);
                    status.textContent = "Translation copied.";
                } catch (error) {
                    output.focus();
                    output.select();

                    const copied = document.execCommand("copy");
                    status.textContent = copied
                        ? "Translation copied."
                        : "Copy failed. Select and copy the text manually.";
                }
            }
        );

        document.getElementById("listenBtn").addEventListener("click", () => {
            if (!output.value.trim()) {
                status.textContent = "Translate some text first.";
                return;
            }

            if (!("speechSynthesis" in window)) {
                status.textContent = "Speech is not supported in this browser.";
                return;
            }

            window.speechSynthesis.cancel();

            const speech = new SpeechSynthesisUtterance(output.value);
            speech.lang = targetLang.value === "hi" ? "hi-IN" : "en-US";
            speech.rate = 0.9;

            window.speechSynthesis.speak(speech);
            status.textContent = "Playing translation...";
        });

        document.getElementById("clearBtn").addEventListener("click", () => {
            input.value = "";
            output.value = "";
            status.textContent = "";
            window.speechSynthesis?.cancel();
            input.focus();
        });
    </script>
</body>
</html>
